<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Google Fotos limita (429) las fotos pedidas con Referer; YouTube conserva el suyo vía su iframe -->
<meta name="referrer" content="no-referrer">
<title>Recuérdame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root { --fg:#fff; --muted:rgba(255,255,255,.7); --glass:rgba(0,0,0,.35); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:#000; color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  .slider { position:fixed; inset:0; touch-action:pan-y; user-select:none; }
  .bg { position:absolute; inset:-40px; width:calc(100% + 80px); height:calc(100% + 80px); object-fit:cover; filter:blur(30px) brightness(.45); }
  .slide { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .8s ease; }
  .slide.on { opacity:1; }
  .slide img, .slide video { max-width:100%; max-height:100%; object-fit:contain; box-shadow:0 10px 40px rgba(0,0,0,.5); }
  .sound { position:absolute; bottom:18px; right:16px; z-index:5; border:0; background:var(--glass); color:#fff; border-radius:20px; padding:8px 14px; font-size:.9rem; cursor:pointer; backdrop-filter:blur(6px); display:none; }
  .sound.show { display:block; }
  .music { border:0; background:var(--glass); color:#fff; border-radius:50%; width:38px; height:38px; cursor:pointer; margin-left:10px; display:inline-flex; align-items:center; justify-content:center; vertical-align:middle; backdrop-filter:blur(6px); }
  .music:hover { background:rgba(0,0,0,.6); }
  .music svg { width:18px; height:18px; fill:#fff; }
  .music.hint { animation:pulse 1.4s infinite; }
  @keyframes pulse { 50% { background:rgba(255,255,255,.3); } }
  .intro { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px 16px; overflow:hidden; background:#000; transition:opacity .9s ease, visibility .9s; }
  .intro.hide { opacity:0; visibility:hidden; }
  .intro .ibg { position:absolute; inset:-60px; width:calc(100% + 120px); height:calc(100% + 120px); object-fit:cover; filter:blur(24px) brightness(.4); transform:scale(1.05); }
  .intro > *:not(.ibg) { position:relative; }
  .intro h1 { font-family:"Cormorant Garamond", Georgia, serif; font-style:italic; font-weight:500; font-size:clamp(3rem, 12vw, 6.5rem); line-height:1; letter-spacing:.01em; text-shadow:0 4px 30px rgba(0,0,0,.6); }
  .intro p { font-family:"Cormorant Garamond", Georgia, serif; font-size:clamp(1.15rem, 4vw, 1.7rem); margin-top:14px; color:rgba(255,255,255,.88); letter-spacing:.04em; }
  .intro .line { width:60px; height:1px; background:rgba(255,255,255,.5); margin:22px auto 0; }
  .start { margin-top:34px; border:1px solid rgba(255,255,255,.6); background:rgba(255,255,255,.12); color:#fff; border-radius:999px; padding:14px 30px; font-size:1rem; letter-spacing:.06em; cursor:pointer; backdrop-filter:blur(6px); display:inline-flex; align-items:center; gap:10px; transition:background .2s, transform .2s; }
  .start:hover { background:rgba(255,255,255,.25); transform:scale(1.03); }
  .start svg { width:18px; height:18px; fill:#fff; }
  /* ---- Tira de miniaturas (deslizar hacia arriba) ---- */
  .handle { position:absolute; bottom:22px; left:16px; z-index:5; border:0; background:var(--glass); color:#fff; border-radius:20px; padding:8px 14px; font-size:.85rem; cursor:pointer; backdrop-filter:blur(6px); display:flex; align-items:center; gap:6px; }
  .handle svg { width:16px; height:16px; fill:#fff; }
  .thumbs { position:fixed; left:0; right:0; bottom:0; z-index:15; background:rgba(10,10,10,.82); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); padding:10px 0 calc(14px + env(safe-area-inset-bottom)); transform:translateY(100%); transition:transform .35s cubic-bezier(.2,.8,.2,1); box-shadow:0 -10px 40px rgba(0,0,0,.5); }
  .thumbs.open { transform:none; }
  .thumbs .grip { width:44px; height:5px; border-radius:3px; background:rgba(255,255,255,.4); margin:0 auto 10px; cursor:pointer; }
  .thumbs .head { display:flex; justify-content:space-between; align-items:center; padding:0 16px 8px; font-size:.85rem; color:var(--muted); }
  .thumbs .close { border:0; background:none; color:#fff; font-size:1.4rem; line-height:1; cursor:pointer; padding:2px 6px; }
  .strip { display:flex; gap:8px; overflow-x:auto; overflow-y:hidden; padding:4px 16px 6px; scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch; overscroll-behavior-x:contain; scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.3) transparent; }
  .strip button { flex:0 0 auto; position:relative; width:96px; height:96px; padding:0; border:2px solid transparent; border-radius:10px; overflow:hidden; background:#222; cursor:pointer; scroll-snap-align:center; transition:border-color .2s, transform .2s; }
  .strip button:hover { transform:translateY(-2px); }
  .strip button.cur { border-color:#fff; }
  .strip img { width:100%; height:100%; object-fit:cover; display:block; }
  .strip .n { position:absolute; left:5px; bottom:4px; font-size:.7rem; text-shadow:0 1px 3px #000; color:#fff; }
  .strip .vid { position:absolute; right:5px; top:5px; width:22px; height:22px; border-radius:50%; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; }
  .strip .vid svg { width:12px; height:12px; fill:#fff; }
  @media (max-width:600px){ .strip button { width:78px; height:78px; } .handle span { display:none; } }
  #yt { position:absolute; width:1px; height:1px; left:-9999px; top:0; }
  .title { position:absolute; top:0; left:0; right:0; padding:16px 20px; background:linear-gradient(rgba(0,0,0,.55),transparent); font-weight:600; font-size:1.1rem; z-index:5; display:flex; justify-content:space-between; align-items:center; }
  .count { font-weight:400; font-size:.9rem; color:var(--muted); font-variant-numeric:tabular-nums; }
  .nav { position:absolute; top:50%; transform:translateY(-50%); z-index:5; width:52px; height:52px; border-radius:50%; border:0; background:var(--glass); color:#fff; font-size:28px; cursor:pointer; backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; transition:background .2s; }
  .nav:hover { background:rgba(0,0,0,.6); }
  .prev { left:16px; } .next { right:16px; }
  .bar { position:absolute; left:0; right:0; bottom:0; height:4px; background:rgba(255,255,255,.15); z-index:5; }
  .bar i { display:block; height:100%; width:0; background:#fff; }
  .bar i.run { width:100%; transition:width linear; }
  .play { position:absolute; bottom:18px; left:50%; transform:translateX(-50%); z-index:5; border:0; background:var(--glass); color:#fff; border-radius:20px; padding:8px 16px; font-size:.9rem; cursor:pointer; backdrop-filter:blur(6px); }
  .title > span:first-child { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-right:10px; }
  .title > span:last-child { flex-shrink:0; }
  @media (max-width:600px){ .title{ font-size:.95rem; padding:12px 14px; } .nav{ width:42px; height:42px; font-size:22px; } .prev{left:8px} .next{right:8px} }
</style>
</head>
<body>
<div class="intro" id="intro">
  <img class="ibg" id="ibg" alt="" referrerpolicy="no-referrer">
  <h1>Recuérdame</h1>
  <p>Fotos de José Quezada Céspedes</p>
  <div class="line"></div>
  <button class="start" id="start"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>Ver fotos</button>
</div>
<div class="slider" id="slider">
  <img class="bg" id="bg" alt="" referrerpolicy="no-referrer">
  <div class="slide" id="a"></div>
  <div class="slide" id="b"></div>
  <div class="title"><span>Fotos de José Quezada Céspedes</span><span><span class="count" id="count"></span><button class="music" id="music" aria-label="Reproducir música" title="Reproducir música"></button></span></div>
  <button class="nav prev" id="prev" aria-label="Anterior">&#8249;</button>
  <button class="nav next" id="next" aria-label="Siguiente">&#8250;</button>
  <button class="play" id="play">❚❚ Pausa</button>
  <button class="sound" id="sound">🔇 Activar sonido</button>
  <div class="bar"><i id="bar"></i></div>
</div>
<button class="handle" id="handle" aria-label="Ver todas las fotos"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg><span>Todas</span></button>
<div class="thumbs" id="thumbs" aria-hidden="true">
  <div class="grip" id="grip"></div>
  <div class="head"><span id="thumbsInfo">Todas las fotos</span><button class="close" id="thumbsClose" aria-label="Cerrar">&times;</button></div>
  <div class="strip" id="strip"></div>
</div>
<div id="yt"></div>

const DELAY = 3000;
const size = () => Math.min(2400, Math.round(Math.max(innerWidth, innerHeight) * (devicePixelRatio || 1)));
const src = i => PHOTOS[i][0] + "=w" + size() + "-h" + size();
const isVideo = i => PHOTOS[i][3] > 0;

const layers = [document.getElementById("a"), document.getElementById("b")];
const bg = document.getElementById("bg"), bar = document.getElementById("bar");
const count = document.getElementById("count"), playBtn = document.getElementById("play");
const soundBtn = document.getElementById("sound");
let idx = 0, front = 0, timer = null, playing = false, started = false, browsing = false, wantSound = true, video = null, token = 0;

function preload(i){ i = (i + PHOTOS.length) % PHOTOS.length; const im = new Image(); im.referrerPolicy = "no-referrer"; im.src = src(i); }

function swap(back){
  layers[back].classList.add("on"); layers[front].classList.remove("on");
  const old = layers[front]; front = back;
  setTimeout(() => { if (!old.classList.contains("on")) { const v = old.querySelector("video"); if (v) { v.pause(); v.removeAttribute("src"); v.load(); } old.innerHTML = ""; } }, 900);
  bg.src = src(idx);
}

function show(i){
  idx = (i + PHOTOS.length) % PHOTOS.length;
  const my = ++token, back = 1 - front, layer = layers[back];
  clearTimeout(timer); stopBar();
  if (video) { video.pause(); video = null; }
  soundBtn.classList.remove("show");
  layer.innerHTML = "";
  count.textContent = `${idx + 1} / ${PHOTOS.length}` + (isVideo(idx) ? " · video" : "");

  if (isVideo(idx)) {
    const v = document.createElement("video");
    v.playsInline = true; v.preload = "auto";
    v.poster = src(idx); v.src = PHOTOS[idx][0] + "=dv";
    v.onended = () => { if (my === token) show(idx + 1); };
    v.onerror = () => { if (my === token) restart(); };          // si falla, sigue como foto
    v.ontimeupdate = () => { if (my === token && v.duration) bar.style.width = (v.currentTime / v.duration * 100) + "%"; };
    layer.appendChild(v); video = v;
    swap(back);
    playVideo(v);
  } else {
    const img = new Image(); img.alt = ""; img.referrerPolicy = "no-referrer";
    img.onload = () => { if (my === token) swap(back); };
    img.src = src(idx); layer.appendChild(img);
    restart();
  }
  preload(idx + 1); preload(idx - 1);
  if (typeof syncMusic === "function") syncMusic();
  if (browsing) markCurrent(true);
}

function playVideo(v){
  if (!playing) return;
  v.muted = !wantSound;
  v.play().catch(() => {           // el navegador bloquea el audio sin interacción: reproduce en silencio
    v.muted = true; soundBtn.classList.add("show"); v.play().catch(() => {});
  });
  if (v.muted) soundBtn.classList.add("show");
}

function stopBar(){ bar.classList.remove("run"); bar.style.transitionDuration = "0ms"; bar.style.width = ""; void bar.offsetWidth; }

function restart(){
  clearTimeout(timer); stopBar();
  if (!playing || browsing) return;
  bar.style.transitionDuration = DELAY + "ms"; bar.classList.add("run");
  timer = setTimeout(() => show(idx + 1), DELAY);
}

function togglePlay(){
  playing = !playing; playBtn.textContent = playing ? "❚❚ Pausa" : "▶ Reproducir";
  if (video) { playing ? playVideo(video) : video.pause(); } else restart();
  syncMusic();
}

soundBtn.onclick = () => { wantSound = true; if (video) { video.muted = false; video.play().catch(() => {}); } soundBtn.classList.remove("show"); };
document.getElementById("next").onclick = () => show(idx + 1);
document.getElementById("prev").onclick = () => show(idx - 1);
playBtn.onclick = togglePlay;
addEventListener("keydown", e => {
  if (!started) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); begin(); } return; }
  if (e.key === "Escape") return closeThumbs();
  if (e.key === "ArrowUp") return openThumbs();
  if (e.key === "ArrowDown") return closeThumbs();
  if (e.key === "ArrowRight") show(idx + 1);
  else if (e.key === "ArrowLeft") show(idx - 1);
  else if (e.key === " ") { e.preventDefault(); togglePlay(); }
});
// deslizar hacia arriba desde la parte inferior abre la tira; en horizontal cambia de foto
let x0 = null, y0 = null;
const sl = document.getElementById("slider");
sl.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive:true });
sl.addEventListener("touchend", e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
  const fromBottom = y0 > innerHeight * 0.55; x0 = y0 = null;
  if (dy < -50 && Math.abs(dy) > Math.abs(dx) && fromBottom) openThumbs();
  else if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) show(idx + (dx < 0 ? 1 : -1));
});
// en computadora: arrastrar con el mouse hacia arriba desde la parte inferior
let m0 = null;
sl.addEventListener("mousedown", e => { if (e.target.closest("button")) return; m0 = [e.clientX, e.clientY]; });
addEventListener("mouseup", e => {
  if (!m0) return;
  const dx = e.clientX - m0[0], dy = e.clientY - m0[1], fromBottom = m0[1] > innerHeight * 0.55; m0 = null;
  if (dy < -50 && Math.abs(dy) > Math.abs(dx) && fromBottom) openThumbs();
});

// ---- Tira de miniaturas ----
const thumbs = document.getElementById("thumbs"), strip = document.getElementById("strip");
const PLAY_SVG = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
let built = false;
function buildThumbs(){
  if (built) return; built = true;
  const frag = document.createDocumentFragment();
  PHOTOS.forEach((p, i) => {
    const b = document.createElement("button");
    b.setAttribute("aria-label", (isVideo(i) ? "Video " : "Foto ") + (i + 1));
    b.innerHTML = `<img loading="lazy" alt="" referrerpolicy="no-referrer" src="${p[0]}=w200-h200-c"><span class="n">${i + 1}</span>` + (isVideo(i) ? `<span class="vid">${PLAY_SVG}</span>` : "");
    b.onclick = () => { closeThumbs(); show(i); };
    frag.appendChild(b);
  });
  strip.appendChild(frag);
  document.getElementById("thumbsInfo").textContent = `${PHOTOS.length} fotos y videos`;
}
function markCurrent(center){
  strip.querySelectorAll(".cur").forEach(b => b.classList.remove("cur"));
  const b = strip.children[idx]; if (!b) return;
  b.classList.add("cur");
  if (center) b.scrollIntoView({ inline:"center", block:"nearest", behavior:"instant" });
}
function openThumbs(){
  if (!started || browsing) return;
  buildThumbs(); browsing = true;
  thumbs.classList.add("open"); thumbs.setAttribute("aria-hidden", "false");
  requestAnimationFrame(() => markCurrent(true));
  if (!video) restart();               // detiene el avance automático mientras eliges
}
function closeThumbs(){
  if (!browsing) return;
  browsing = false; thumbs.classList.remove("open"); thumbs.setAttribute("aria-hidden", "true");
  if (!video) restart();
}
document.getElementById("handle").onclick = e => { e.stopPropagation(); openThumbs(); };
document.getElementById("thumbsClose").onclick = closeThumbs;
document.getElementById("grip").onclick = closeThumbs;
// la rueda del mouse desplaza la tira en horizontal
strip.addEventListener("wheel", e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { strip.scrollLeft += e.deltaY; e.preventDefault(); } }, { passive:false });
// deslizar hacia abajo sobre la tira la cierra
let ty0 = null, tx0 = null;
thumbs.addEventListener("touchstart", e => { ty0 = e.touches[0].clientY; tx0 = e.touches[0].clientX; }, { passive:true });
thumbs.addEventListener("touchend", e => {
  if (ty0 === null) return;
  const dy = e.changedTouches[0].clientY - ty0, dx = e.changedTouches[0].clientX - tx0; ty0 = tx0 = null;
  if (dy > 50 && dy > Math.abs(dx)) closeThumbs();
});
// tocar la foto (fuera de la tira) también la cierra
sl.addEventListener("click", e => { if (browsing && !e.target.closest("button")) closeThumbs(); });

// ---- Música de fondo (YouTube) ----
const SONG = "tXcJkLDahKg";
const musicBtn = document.getElementById("music");
let yt = null, ytReady = false, musicOn = true;

window.onYouTubeIframeAPIReady = () => {
  yt = new YT.Player("yt", {
    videoId: SONG, width: 1, height: 1,
    playerVars: { autoplay: 0, controls: 0, playsinline: 1, loop: 1, playlist: SONG },
    events: {
      onReady: () => { ytReady = true; yt.setVolume(70); syncMusic(); },
      onStateChange: e => {
        if (e.data === YT.PlayerState.ENDED) { yt.seekTo(0); syncMusic(); }
        if (e.data === YT.PlayerState.PLAYING) musicBtn.classList.remove("hint");
        paintMusic();
      }
    }
  });
};

// Suena solo si está activada, el slider no está en pausa y no se está mostrando un video
const ICON_PLAY  = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
const musicPlaying = () => ytReady && yt.getPlayerState() === YT.PlayerState.PLAYING;

// El icono muestra el estado real: ❚❚ si suena (clic = pausar), ▶ si no suena (clic = reproducir)
function paintMusic(){
  const on = musicPlaying();
  musicBtn.innerHTML = on ? ICON_PAUSE : ICON_PLAY;
  musicBtn.title = musicBtn.ariaLabel = on ? "Pausar música" : "Reproducir música";
}

function syncMusic(){
  if (!ytReady) return;
  const should = musicOn && playing && !isVideo(idx);
  if (should && !musicPlaying()) {
    yt.playVideo();
    // si el navegador bloquea el audio sin interacción, el icono ▶ parpadea
    setTimeout(() => { if (musicOn && !isVideo(idx) && !musicPlaying()) musicBtn.classList.add("hint"); }, 1500);
  } else if (!should && musicPlaying()) yt.pauseVideo();
}

musicBtn.onclick = e => {
  e.stopPropagation();
  musicOn = !musicPlaying();          // sonando → pausar; detenida o bloqueada → reproducir
  musicBtn.classList.remove("hint"); syncMusic(); paintMusic();
};
paintMusic();
// la primera interacción con la página desbloquea el audio
const unlock = e => { if (e.target.closest && e.target.closest('#music')) return; syncMusic(); removeEventListener("pointerdown", unlock); removeEventListener("keydown", unlock); };
addEventListener("pointerdown", unlock); addEventListener("keydown", unlock);

// ---- Pantalla de inicio: el toque en "Ver fotos" habilita el audio de la música y los videos ----
document.getElementById("ibg").src = src(0);
function begin(){
  if (started) return;
  started = true; playing = true;
  playBtn.textContent = "❚❚ Pausa";
  document.getElementById("intro").classList.add("hide");
  show(0);
}
document.getElementById("start").onclick = begin;
playBtn.textContent = "▶ Reproducir";
show(0);
</script>
</body>
